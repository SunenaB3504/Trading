name: Daily Mock-Trading Runner

on:
  # Schedule is off until the real daily cycle exists (Phase 4 adds
  # cron '0 13 * * 1-5' = 18:30 IST, after EOD files are published).
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-daily-trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute Daily Mock-Trading Session
        run: |
          python tools/live_agent/daily_agent_runner.py

      - name: Commit and Push Ledger Updates to Private Repo
        run: |
          git config --global user.name "Mock-Trader Bot"
          git config --global user.email "bot@mocktrader.local"
          git add data/live_ledger/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Mock-Trading Run: $(date '+%Y-%m-%d %H:%M:%S IST')" && git push origin main)
