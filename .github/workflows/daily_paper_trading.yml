name: Daily Astro-Compass Paper-Trading Runner

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST, Monday through Friday
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-daily-trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyswisseph pandas numpy scipy

      - name: Execute Daily 4-Trader Trading Session
        run: |
          python tools/live_agent/daily_agent_runner.py

      - name: Commit and Push Ledger Updates to Private Repo
        run: |
          git config --global user.name "Astro-Trader Bot"
          git config --global user.email "bot@astrotrader.local"
          git add data/live_ledger/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Paper-Trading Run: $(date '+%Y-%m-%d %H:%M:%S IST')" && git push origin main)
