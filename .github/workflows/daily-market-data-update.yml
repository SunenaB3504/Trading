name: Daily Market Data Update

# Automatically fetches the latest NSE daily market bars every weekday evening
# after market close, and commits the updated data fixtures back to the repo.

on:
  schedule:
    # Runs at 12:00 UTC (17:30 IST), Monday through Friday
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Sync Latest NSE Bhavcopy
        run: python packages/simulator/scripts/syncLatestNseMarketData.py

      - name: Commit and push updated market data
        run: |
          if ! git diff --quiet packages/simulator/src/core/data/fixtures/barsManifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add packages/simulator/public/data/bars/ packages/simulator/src/core/data/fixtures/barsManifest.json packages/simulator/src/core/data/fixtures/nifty500Prices.json
            git commit -m "chore(data): auto-sync latest NSE Bhavcopy market data"
            git push
            echo "Successfully committed and pushed updated market data."
          else
            echo "No new market data found. Repository is already up to date."
          fi

